[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-to-vault"
version = "0.1.1"
description = "Route voice/transcript captures into an Obsidian vault — atomically, idempotently, with no silent loss."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "guillaumevele" }]
keywords = [
    "obsidian", "voice", "transcription", "webhook", "knowledge-management",
    "second-brain", "note-taking", "routing", "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/guillaumevele/voice-to-vault"
Repository = "https://github.com/guillaumevele/voice-to-vault"
Issues = "https://github.com/guillaumevele/voice-to-vault/issues"

[project.scripts]
voice-to-vault = "voice_to_vault.cli:main"

[tool.setuptools]
packages = ["voice_to_vault"]
